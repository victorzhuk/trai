[package]
name = "trai"
version = "0.2.1"
edition = "2021"
description = "Local-first meeting transcribe-and-translate app for Linux: dual PipeWire capture, Whisper transcription, translation, live UI"
license = "Apache-2.0"
repository = "https://github.com/victorzhuk/trai"
readme = "README.md"
publish = false

[[bin]]
name = "trai"
path = "src/main.rs"

[lib]
name = "trai"
path = "src/lib.rs"

[dependencies]
earshot = "1.2.1"
hound = "3"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1"
toml = "0.8"
url = "2"

[features]
# Enabled by the dev-dependency below so integration tests (and only
# they) get the Fake transcriber/translator doubles.
test-doubles = []

[build-dependencies]
slint-build = "1"

[dev-dependencies]
tempfile = "3"
trai = { path = ".", features = ["test-doubles"] }
