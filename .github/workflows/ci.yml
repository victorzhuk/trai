name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libpulse-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgl1-mesa-dev \
            libfontconfig-dev \
            libfreetype6-dev

      - uses: Swatinem/rust-cache@v2

      - name: fmt-check
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libpulse-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgl1-mesa-dev \
            libfontconfig-dev \
            libfreetype6-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: trai-linux-x86_64
          path: target/release/trai
